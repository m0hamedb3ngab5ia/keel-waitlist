<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mizo — Coming soon</title>
<meta name="description" content="Mizo is coming soon to iPhone. Join the waitlist.">
<meta name="robots" content="noindex">
<style>
:root{--bg:#fbfbfd;--fg:#1d1d1f;--mut:#6e6e73;--line:#d2d2d7;--acc:#0a6cff;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--mut:#a1a1a6;--line:#38383a;--acc:#4c9aff;--card:#1c1c1e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:max(48px,env(safe-area-inset-top)) 20px 64px}
.tag{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
h1{font-size:clamp(34px,9vw,52px);line-height:1.07;letter-spacing:-.02em;margin:12px 0 16px}
.lead{font-size:20px;color:var(--mut);margin:0 0 28px}
form{display:flex;flex-direction:column;gap:10px;margin:0 0 8px}
input[type=email]{font:inherit;font-size:17px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);width:100%}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;font-weight:600;padding:14px 16px;border:0;border-radius:12px;background:var(--acc);color:#fff;cursor:pointer;min-height:48px}
.priv{font-size:14px;color:var(--mut);margin:0 0 48px}
h2{font-size:22px;letter-spacing:-.01em;margin:0 0 8px}
dl{margin:0 0 40px}dt{font-weight:600;margin-top:20px}dd{margin:2px 0 0;color:var(--mut)}
.fine{font-size:13px;color:var(--mut);border-top:1px solid var(--line);padding-top:16px}
.hp{position:absolute;left:-9999px}
.feat{list-style:none;padding:0;margin:28px 0 0;font-size:17px;font-weight:600}.feat li{padding:10px 0;border-top:1px solid rgba(128,128,128,.25)}</style></head><body><main>
<div class="tag">Coming soon &middot; iPhone</div>
<h1>The app built to let you go.</h1>
<form action="https://formspree.io/f/mjywrpok" method="POST">
<label class="hp" aria-hidden="true">Leave empty <input name="_gotcha" tabindex="-1" autocomplete="off"></label>
<input type="hidden" name="src" value="direct">
<input type="hidden" name="v" value="d">
<input type="email" name="email" placeholder="you@example.com" autocomplete="email" inputmode="email" required aria-label="Email address">
<button type="submit">Join the waitlist</button>
</form>
<p class="priv">Launch emails only.</p>
<ul class="feat"><li>Support that steps back</li><li>Habits that become yours</li><li>Graduate from the app</li><li>No ads. No feeds.</li></ul>
</main><script>var q=new URLSearchParams(location.search).get("src");if(q)document.querySelector("[name=src]").value=q.slice(0,30)</script></body></html>
